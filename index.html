<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shado - شادو</title>
    <!-- مكتبات فايربيس -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 400px; background: #161b22; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        input, button { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 16px; }
        button { background: #8250df; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #6e40c9; }
        #chat-section { display: none; text-align: right; height: 80vh; display: flex; flex-direction: column; justify-content: space-between; }
        .typing { font-size: 12px; color: #8b949e; display: none; font-style: italic; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container" id="auth-container">
    <h2>SHADO</h2>
    <p>أدخل رقم هاتفك للبدء</p>
    <input type="text" id="phone-number" placeholder="+20xxxxxxxxxx">
    <button id="send-otp-btn" onclick="sendOtp()">إرسال رمز التحقق</button>
    
    <div id="otp-box" style="display:none;">
        <input type="text" id="otp-code" placeholder="أدخل رمز التحقق (OTP)">
        <button onclick="verifyOtp()">تأكيد الكود</button>
    </div>
    <div id="recaptcha-container"></div>
</div>

<div class="container" id="chat-section" style="display:none;">
    <div>
        <h3>غرفة محادثة شادو</h3>
        <span id="user-status" style="font-size: 12px; color: #3fb950;">● متصل الآن</span>
    </div>
    <div id="messages-list" style="flex-grow: 1; overflow-y: auto; text-align: right; padding: 10px; background: #0d1117; border-radius: 8px; margin: 10px 0;"></div>
    
    <div class="typing" id="typing-indicator">يكتب الآن... ✍️</div>
    
    <div style="display: flex;">
        <input type="text" id="message-input" placeholder="اكتب رسالة..." style="flex-grow: 1; margin: 0;" oninput="notifyTyping()">
        <button onclick="sendMessage()" style="width: 80px; margin: 0 5px 0 0;">إرسال</button>
    </div>
</div>

<script>
    // إعدادات فايربيس الخاصة بك
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible'
    });

    function sendOtp() {
        const phoneNumber = document.getElementById('phone-number').value;
        const appVerifier = window.recaptchaVerifier;
        auth.signInWithPhoneNumber(phoneNumber, appVerifier)
            .then((confirmationResult) => {
                window.confirmationResult = confirmationResult;
                document.getElementById('otp-box').style.display = 'block';
                alert("تم إرسال الكود بنجاح!");
            }).catch((error) => {
                alert("حدث خطأ أثناء إرسال الكود: " + error.message);
            });
    }

    function verifyOtp() {
        const code = document.getElementById('otp-code').value;
        window.confirmationResult.confirm(code).then((result) => {
            const user = result.user;
            // تحديث حالة المستخدم إلى متصل في الفايرستور
            db.collection('users').doc(user.uid).set({
                status: 'online',
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('chat-section').style.display = 'flex';
            loadMessages();
        }).catch((error) => {
            alert("الكود غير صحيح!");
        });
    }

    function sendMessage() {
        const text = document.getElementById('message-input').value;
        if (!text.trim()) return;
        db.collection('messages').add({
            text: text,
            sender: auth.currentUser.phoneNumber,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            document.getElementById('message-input').value = '';
        });
    }

    function loadMessages() {
        db.collection('messages').orderBy('timestamp').onSnapshot((snapshot) => {
            const list = document.getElementById('messages-list');
            list.innerHTML = '';
            snapshot.forEach((doc) => {
                const msg = doc.data();
                list.innerHTML += `<div style="margin-bottom: 8px;"><b>${msg.sender}:</b> ${msg.text}</div>`;
            });
            list.scrollTop = list.scrollHeight;
        });
    }

    function notifyTyping() {
        // ميزة إشعار الكتابة التفاعلية
        const indicator = document.getElementById('typing-indicator');
        // يمكن ربطها بقاعدة البيانات لاحقاً لتظهر للطرف الآخر
    }
</script>

</body>
</html>
